# Docs: Electron - https://docs.flatpak.org/en/latest/electron.html
# Docs: Dotnet - https://docs.flatpak.org/en/latest/dotnet.html
app-id: com.nexusmods.vortex
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: run.sh

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.dotnet9

build-options:
  prepend-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/dotnet9/bin
  append-ld-library-path: /usr/lib/sdk/dotnet9/lib
  env:
    # Electron install behavior (global): prevent Electron downloads because BaseApp provides it.
    # Ref: https://github.com/electron/electron/blob/main/docs/api/environment-variables.md
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    # Node/pnpm offline cache locations for reproducible builds.
    # Flatpak builds run offline by default; these paths are inside the build sandbox.
    # Ref: https://docs.flatpak.org/en/latest/electron.html#the-application-module
    npm_config_cache: /run/build/vortex/flatpak-node/npm-cache
    npm_config_nodedir: /usr/lib/sdk/node24
    npm_config_offline: "true"
    PNPM_CONFIG_TRUST_LOCKFILE: "true"
    XDG_CACHE_HOME: /run/build/vortex/flatpak-node/cache

    # Dotnet SDK settings for build-time tools (runtime DOTNET_ROOT is set via finish-args).
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_ROOT: /usr/lib/sdk/dotnet9/lib
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    # Build stability: avoid parallel extension builds.
    NODE_OPTIONS: --v8-pool-size=1
    RAYON_NUM_THREADS: "1"
    TOKIO_WORKER_THREADS: "1"
    UV_THREADPOOL_SIZE: "1"
    NX_DAEMON: "false"
    # Skip git submodule updates (submodules are already fetched by flatpak-builder).
    # FOMOD installer builds are still needed and run during preinstall.
    NO_PARALLEL: "1"
    VORTEX_SKIP_SUBMODULES: "1"

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  # Full host filesystem access is required for modding workflows:
  # game installs can be anywhere, deployment uses hardlinks/symlinks/moves,
  # plugins and external tools need arbitrary path access.
  # Portals are not viable because scanning and deployment are background ops
  # that can't wait for user-mediated prompts.
  - --filesystem=host
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.UDisks2
  # Required for xdg-settings to register nxm:// protocol handler on host
  - --talk-name=org.freedesktop.Flatpak
  # Runtime: .NET runtime location for framework-dependent tools
  - --env=DOTNET_ROOT=/app/lib/dotnet
  # Integration: disable internal updater (Flatpak handles updates)
  - --env=IGNORE_UPDATES=yes
  - --env=IS_FLATPAK=true
  # Integration: use gio for trash, respect host cursor theme
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: dotnet-runtime
    buildsystem: simple
    build-commands:
      # Install the .NET runtime into /app/lib/dotnet for framework-dependent tools.
      - /usr/lib/sdk/dotnet9/bin/install.sh

  - name: vortex
    buildsystem: simple
    build-commands:
      # Steps match `.github/workflows/package.yml` where possible.

      - |
        cat > NuGet.Config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="offline" value="flatpak-nuget-sources" />
          </packageSources>
        </configuration>
        EOF
        cat > tools/dotnetprobe/nuget.config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="offline" value="../../flatpak-nuget-sources" />
          </packageSources>
        </configuration>
        EOF
      # The Node SDK extension does not include pnpm. Bootstrap the exact
      # lockfile-pinned pnpm CLI from the generated offline sources.
      - |
        set -eu
        pnpm_version="$(node -p "require('./package.json').packageManager.match(/^pnpm@([^+]+)/)[1]")"
        mkdir -p .flatpak-pnpm
        tar -xzf "flatpak-node/pnpm-tarballs/pnpm-$pnpm_version.tgz" \
          --strip-components=1 -C .flatpak-pnpm
        cat > .flatpak-pnpm/bin/pnpm <<'SH'
        #!/bin/sh
        exec node "$(dirname "$0")/pnpm.cjs" "$@"
        SH
        chmod +x .flatpak-pnpm/bin/pnpm
        export PATH="$PWD/.flatpak-pnpm/bin:$PATH"

        # Use the exact Node version provided by the SDK instead of downloading
        # the runtime package during the offline install.
        node - <<'NODE'
        const fs = require('node:fs');
        const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        for (const section of ['engines', 'devEngines']) {
          if (packageJson[section]?.runtime) {
            packageJson[section].runtime.onFail = 'ignore';
          }
        }
        fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
        NODE

        # Drop the SDK-provided runtime dependency from the build-only lockfile.
        node flatpak/scripts/_flatpak_pnpm_build_lock.cjs
        VORTEX_ELECTRON_REBUILD=defer node .flatpak-pnpm/bin/pnpm.cjs install --offline --frozen-lockfile --trust-lockfile
        export PATH="$PWD/node_modules/.pnpm/node_modules/.bin:$PWD/src/main/node_modules/.bin:$PWD/node_modules/.bin:$PATH"
        node src/main/node_modules/@nexusmods/fomod-installer-native/install.js
        test -f src/main/node_modules/@nexusmods/fomod-installer-native/ModInstaller.Native.so
        (cd src/main && pnpm exec electron-rebuild --only @nexusmods/fomod-installer-native,drivelist,leveldown,xxhash-addon,@parcel/watcher --sequential)
        electron_version="$(node -p "require('./src/main/node_modules/electron/package.json').version")"
        src/main/node_modules/.bin/electron-rebuild \
          --module-dir extensions/theme-switcher \
          --version "$electron_version" \
          --only font-scanner --types dev --sequential

        # Stage the Linux DuckDB extension from the offline source manifest.
        duckdb_version="$(node -p "require('./src/main/node_modules/@duckdb/node-api/package.json').version.match(/^(\d+\.\d+\.\d+)-r\.\d+$/)[1]")"
        duckdb_version="v$duckdb_version"
        mkdir -p "src/main/build/duckdb-extensions/$duckdb_version/linux_amd64"
        gzip -dc flatpak-node/duckdb-extensions/level_pivot-linux_amd64.duckdb_extension.gz \
          > "src/main/build/duckdb-extensions/$duckdb_version/linux_amd64/level_pivot.duckdb_extension"
        node - <<'NODE'
        const fs = require('node:fs');
        const configPath = 'src/main/duckdb-extensions.json';
        const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
        config.platforms = config.platforms.filter(platform => platform === 'linux_amd64');
        if (config.platforms.length !== 1) {
          throw new Error('Expected the Linux x86_64 DuckDB platform');
        }
        fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
        NODE

        # Build targets only; lint and typecheck run in the regular CI pipeline.
        node .flatpak-pnpm/bin/pnpm.cjs nx run-many -t build --parallel=1
        printf '%s\n' 'offline=true' 'trust-lockfile=true' 'ignore-scripts=true' > .npmrc
        node - <<'NODE'
        const fs = require('node:fs');
        const packagePath = 'src/main/package.json';
        const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
        const expected = 'pnpm -F @vortex/main deploy ./dist';
        if (!packageJson.scripts.publish?.includes(expected)) {
          throw new Error(`Expected publish script to include "${expected}"`);
        }
        packageJson.scripts.publish = packageJson.scripts.publish.replace(
          expected,
          'pnpm -F @vortex/main deploy --offline --trust-lockfile --ignore-scripts ./dist',
        );
        fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');
        NODE
        VORTEX_ELECTRON_REBUILD=defer NODE_ENV=production \
          node .flatpak-pnpm/bin/pnpm.cjs nx run @vortex/main:publish
        rm .npmrc

        # Rebuild the deployed native modules for Electron, then stage a
        # directory build of the application.
        (
          cd src/main/dist
          node node_modules/@nexusmods/fomod-installer-native/install.js
          test -f node_modules/@nexusmods/fomod-installer-native/ModInstaller.Native.so
          node_modules/.bin/electron-rebuild \
            --only @nexusmods/fomod-installer-native,drivelist,leveldown,xxhash-addon,@parcel/watcher \
            --sequential
          node_modules/.bin/electron-builder \
            --config electron-builder.config.json \
            --publish never --linux dir
        )

      # Install the launcher, desktop file, icon, and metainfo into the Flatpak image.
      - install -Dm755 flatpak/run.sh /app/bin/run.sh
      - install -Dm644 flatpak/com.nexusmods.vortex.desktop /app/share/applications/com.nexusmods.vortex.desktop
      - install -Dm644 assets/images/vortex.png /app/share/icons/hicolor/256x256/apps/com.nexusmods.vortex.png
      - install -Dm644 flatpak/com.nexusmods.vortex.metainfo.xml /app/share/metainfo/com.nexusmods.vortex.metainfo.xml

      # Stage the built electron distribution into /app/main for runtime.
      - install -d /app/main
      - cp -a dist/linux*-unpacked/. /app/main/
    sources:
      - type: dir
        path: ..
      - generated-sources.json
      - generated-nuget-sources.json
